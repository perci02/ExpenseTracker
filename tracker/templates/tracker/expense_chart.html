{% extends 'tracker/base.html' %} {% block title %}Expense Analytics - Smart
Expense Tracker{% endblock %} {% block content %}
<div class="container">
  <div class="row py-5">
    <div class="col-lg-10 mx-auto">
      <div class="card">
        <div class="card-header bg-dark border-secondary">
          <h2 class="card-title mb-0">
            <i class="fas fa-chart-pie text-success"></i> Expense Visualization
          </h2>
        </div>
        <div class="card-body p-4">
          {% if labels %}
          <div
            class="chart-container"
            style="position: relative; height: 500px"
          >
            <canvas id="expenseChart"></canvas>
          </div>

          <div class="mt-4 text-center">
            <a href="{% url 'expense_list' %}" class="btn btn-outline-primary">
              <i class="fas fa-list"></i> Back to Expenses
            </a>
          </div>
          {% else %}
          <div
            class="alert alert-info alert-dismissible fade show"
            role="alert"
          >
            <i class="fas fa-info-circle"></i>
            <strong>No data available!</strong>
            <a href="{% url 'add_expense' %}" class="alert-link"
              >Add expenses</a
            >
            to see the visualization.
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  const labels = {{ labels|safe }};
  const data = {{ data|safe }};
  const ctx = document.getElementById('expenseChart');

  const chartConfig = {
      type: 'bar',
      data: {
          labels: labels,
          datasets: [{
              label: 'Expenses (₹)',
              data: data,
              backgroundColor: [
                  'rgba(31, 111, 235, 0.6)',
                  'rgba(35, 134, 54, 0.6)',
                  'rgba(210, 153, 34, 0.6)',
                  'rgba(218, 54, 51, 0.6)',
                  'rgba(88, 166, 255, 0.6)',
                  'rgba(56, 189, 248, 0.6)',
                  'rgba(34, 197, 94, 0.6)',
                  'rgba(251, 146, 60, 0.6)',
                  'rgba(244, 63, 94, 0.6)',
                  'rgba(139, 92, 246, 0.6)',
              ],
              borderColor: [
                  'rgba(31, 111, 235, 1)',
                  'rgba(35, 134, 54, 1)',
                  'rgba(210, 153, 34, 1)',
                  'rgba(218, 54, 51, 1)',
                  'rgba(88, 166, 255, 1)',
                  'rgba(56, 189, 248, 1)',
                  'rgba(34, 197, 94, 1)',
                  'rgba(251, 146, 60, 1)',
                  'rgba(244, 63, 94, 1)',
                  'rgba(139, 92, 246, 1)',
              ],
              borderWidth: 2,
              borderRadius: 5,
          }]
      },
      options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
              legend: {
                  display: true,
                  labels: {
                      color: '#8b949e',
                      font: {
                          size: 12,
                          weight: '500'
                      },
                      padding: 15
                  }
              },
          },
          scales: {
              y: {
                  beginAtZero: true,
                  ticks: {
                      color: '#8b949e'
                  },
                  grid: {
                      color: 'rgba(48, 54, 61, 0.3)'
                  }
              },
              x: {
                  ticks: {
                      color: '#8b949e'
                  },
                  grid: {
                      color: 'rgba(48, 54, 61, 0.3)'
                  }
              }
          }
      }
  };

  new Chart(ctx, chartConfig);
</script>

<style>
  .chart-container {
    position: relative;
    width: 100%;
  }
</style>
{% endblock %}
